  <style>
/* ===========================================================
   AIBOLIT — ветеринарная клиника
   Токены: изумрудный + бежевый, минимализм, засечки для заголовков
   =========================================================== */

:root {
  --emerald-900: #041d18;
  --emerald-800: #06251f;
  --emerald-700: #0e352c;
  --beige-600: #b39a7c;
  --beige-400: #cbb595;
  --beige-200: #ece1cf;
  --cream: #f7f2e8;
  --ink: #0b1f1b;
  --line: rgba(11, 31, 27, 0.12);
  --line-on-dark: rgba(247, 242, 232, 0.18);

  --font-serif: "Lora", "Georgia", serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;

  --radius: 4px;
  --max-width: 1120px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--cream);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--font-serif);
  font-weight: 600;
  line-height: 1.15;
  margin: 0 0 0.5em;
}

p { margin: 0 0 1em; max-width: 62ch; }
a { color: inherit; }
img { max-width: 100%; display: block; }

.container {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 28px;
}

/* ---------- Navigation ---------- */
.nav {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--cream);
  border-bottom: 1px solid var(--line);
}
.nav .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 18px;
  padding-bottom: 18px;
}
.nav__brand {
  font-family: var(--font-serif);
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--emerald-900);
  text-decoration: none;
  letter-spacing: 0.01em;
}
.nav__links {
  display: flex;
  gap: 32px;
  list-style: none;
  margin: 0;
  padding: 0;
}
.nav__links a {
  text-decoration: none;
  font-size: 0.95rem;
  color: var(--ink);
  border-bottom: 1px solid transparent;
  padding-bottom: 2px;
  transition: border-color 0.15s ease;
}
.nav__links a:hover { border-color: var(--beige-600); }
.nav__actions { display: flex; gap: 12px; align-items: center; }
.nav__toggle { display: none; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  font-size: 0.95rem;
  font-family: var(--font-sans);
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.12s ease, background 0.15s ease, color 0.15s ease;
}
.btn:active { transform: translateY(1px); }
.btn--primary {
  background: var(--emerald-900);
  color: var(--cream);
}
.btn--primary:hover { background: var(--emerald-700); }
.btn--ghost {
  background: transparent;
  border-color: var(--ink);
  color: var(--ink);
}
.btn--ghost:hover { background: var(--ink); color: var(--cream); }
.btn--on-dark {
  background: var(--beige-400);
  color: var(--emerald-900);
}
.btn--on-dark:hover { background: var(--beige-200); }
.btn--block { width: 100%; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

/* ---------- Hero (split panel, echoes the brand swatch) ---------- */
.hero {
  display: grid;
  grid-template-columns: 1.1fr 0.9fr;
  min-height: 560px;
}
.hero__panel {
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 64px 56px;
}
.hero__panel--dark {
  background: var(--emerald-900);
  color: var(--beige-200);
}
.hero__panel--light { background: var(--beige-200); }
.hero__eyebrow {
  font-size: 0.85rem;
  color: var(--beige-400);
  margin-bottom: 18px;
}
.hero__panel--light .hero__eyebrow { color: var(--emerald-700); }
.hero h1 {
  font-size: clamp(2.1rem, 4vw, 3.2rem);
  max-width: 12ch;
  color: var(--beige-200);
}
.hero__panel--light h1 { color: var(--emerald-900); }
.hero__panel--light p { color: var(--emerald-800); }
.hero__panel--dark p { color: var(--beige-200); opacity: 0.85; }
.hero__stats {
  display: flex;
  gap: 40px;
  margin-top: 8px;
}
.hero__stat strong {
  display: block;
  font-family: var(--font-serif);
  font-size: 1.6rem;
  color: var(--emerald-900);
}
.hero__actions { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }

/* ---------- Sections ---------- */
.section { padding: 88px 0; }
.section--tight { padding: 56px 0; }
.section--dark { background: var(--emerald-900); color: var(--beige-200); }
.section--dark p { color: var(--beige-200); opacity: 0.85; }
.section--beige { background: var(--beige-200); }
.section__head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 24px;
  margin-bottom: 40px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
}
.section--dark .section__head { border-color: var(--line-on-dark); }
.section__head h2 { font-size: clamp(1.6rem, 3vw, 2.2rem); margin: 0; }
.section__head .lede { max-width: 46ch; color: inherit; opacity: 0.75; margin: 0; }

/* ---------- Role cards ---------- */
.roles-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
}
.role-card {
  background: var(--cream);
  padding: 32px 26px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.role-card__index {
  font-family: var(--font-serif);
  color: var(--beige-600);
  font-size: 1.6rem;
}
.role-card h3 { font-size: 1.15rem; margin: 0; }
.role-card p { font-size: 0.9rem; opacity: 0.75; margin: 0; }

/* ---------- Services / shop preview ---------- */
.services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 28px;
}
.service-card {
  border: 1px solid var(--line-on-dark);
  padding: 26px;
  border-radius: var(--radius);
}
.service-card h3 { font-size: 1.05rem; color: var(--beige-200); }
.service-card p { font-size: 0.9rem; }

/* ---------- Footer ---------- */
.footer {
  background: var(--emerald-900);
  color: var(--beige-400);
  padding: 48px 0 28px;
}
.footer .container {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 24px;
}
.footer small { opacity: 0.6; }

/* ---------- Auth pages (login / register) ---------- */
.auth-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.auth-shell__side {
  background: var(--emerald-900);
  color: var(--beige-200);
  padding: 56px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.auth-shell__form {
  padding: 56px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.auth-card { max-width: 440px; margin: 0 auto; width: 100%; }
.auth-card h1 { font-size: 1.9rem; }
.auth-card .sub { opacity: 0.7; margin-bottom: 32px; }

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-size: 0.85rem;
  margin-bottom: 6px;
  color: var(--emerald-800);
}
.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-family: var(--font-sans);
  font-size: 0.95rem;
  background: #fff;
  color: var(--ink);
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: 2px solid var(--emerald-700);
  outline-offset: 1px;
}
.field-row { display: flex; gap: 14px; }
.field-row .field { flex: 1; }
.field__hint { font-size: 0.78rem; opacity: 0.6; margin-top: 4px; }

/* Step indicator */
.steps {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
}
.steps span {
  flex: 1;
  height: 3px;
  background: var(--line);
  border-radius: 2px;
}
.steps span.is-active,
.steps span.is-done { background: var(--emerald-800); }

.step { display: none; }
.step.is-active { display: block; }

/* Role picker (radio cards) */
.role-picker {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.role-option { position: relative; }
.role-option input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.role-option label {
  display: block;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  font-size: 0.9rem;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.role-option label strong { display: block; font-family: var(--font-serif); font-size: 1rem; margin-bottom: 4px; }
.role-option input:checked + label {
  border-color: var(--emerald-800);
  background: var(--beige-200);
}
.role-option input:focus-visible + label { outline: 2px solid var(--emerald-800); outline-offset: 2px; }

.step-nav { display: flex; justify-content: space-between; margin-top: 28px; gap: 12px; }

.role-fields {
  display: none;
  border-top: 1px solid var(--line);
  padding-top: 20px;
  margin-top: 4px;
}
.role-fields.is-visible { display: block; }

/* ---------- Feed (lenta) ---------- */
.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr 300px;
  min-height: 100vh;
}
.app-sidebar {
  background: var(--emerald-900);
  color: var(--beige-200);
  padding: 32px 24px;
}
.app-sidebar__brand {
  font-family: var(--font-serif);
  font-size: 1.3rem;
  margin-bottom: 40px;
  display: block;
  color: var(--beige-200);
  text-decoration: none;
}
.app-sidebar nav a {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 10px;
  border-radius: var(--radius);
  text-decoration: none;
  color: var(--beige-200);
  font-size: 0.95rem;
  margin-bottom: 4px;
  opacity: 0.85;
}
.app-sidebar nav a.is-active,
.app-sidebar nav a:hover { background: var(--emerald-700); opacity: 1; }

.app-main { padding: 32px 40px; max-width: 640px; }
.composer {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 28px;
  background: #fff;
}
.composer textarea {
  width: 100%;
  border: none;
  resize: none;
  font-family: var(--font-sans);
  font-size: 0.95rem;
  min-height: 60px;
}
.composer textarea:focus { outline: none; }
.composer__bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.post {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
  background: #fff;
}
.post__head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.post__avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--beige-400);
  flex-shrink: 0;
}
.post__meta strong { display: block; font-size: 0.92rem; }
.post__meta span { font-size: 0.78rem; opacity: 0.6; }
.post__tag {
  margin-left: auto;
  font-size: 0.72rem;
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 20px;
  opacity: 0.75;
}
.post p { font-size: 0.93rem; margin-bottom: 12px; }
.post__actions { display: flex; gap: 18px; font-size: 0.85rem; opacity: 0.7; }

.app-aside { padding: 32px 24px; border-left: 1px solid var(--line); }
.app-aside h4 { font-size: 0.85rem; text-transform: none; opacity: 0.6; margin-bottom: 16px; }
.vet-suggestion { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.vet-suggestion__avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--beige-400); }
.vet-suggestion strong { display: block; font-size: 0.88rem; }
.vet-suggestion span { font-size: 0.76rem; opacity: 0.6; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
  .hero { grid-template-columns: 1fr; }
  .roles-grid { grid-template-columns: repeat(2, 1fr); }
  .auth-shell { grid-template-columns: 1fr; }
  .auth-shell__side { display: none; }
  .app-shell { grid-template-columns: 1fr; }
  .app-sidebar, .app-aside { display: none; }
  .nav__links { display: none; }
}
@media (max-width: 640px) {
  .roles-grid { grid-template-columns: 1fr; }
  .role-picker { grid-template-columns: 1fr; }
  .field-row { flex-direction: column; gap: 0; }
  .hero__panel { padding: 40px 24px; }
}

/* ===========================================================
   Расширение: рабочая лента, профиль, заказы, магазин, чат
   =========================================================== */

/* ---------- Avatars (общие) ---------- */
.avatar {
  border-radius: 50%;
  background: var(--beige-400);
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-serif);
  color: var(--emerald-900);
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  flex-shrink: 0;
}
.avatar--sidebar { width: 40px; height: 40px; }
.avatar--sm { width: 38px; height: 38px; }
.avatar--profile { width: 88px; height: 88px; font-size: 1.6rem; }

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--emerald-700);
  border-radius: var(--radius);
  margin-bottom: 24px;
}
.sidebar-user strong { display: block; font-size: 0.9rem; color: var(--beige-200); }
.sidebar-user span { font-size: 0.76rem; opacity: 0.7; }

/* ---------- Post action buttons (лента) ---------- */
.post__action-btn {
  background: none;
  border: none;
  font: inherit;
  font-size: 0.85rem;
  color: var(--ink);
  opacity: 0.7;
  cursor: pointer;
  padding: 0;
  text-decoration: none;
}
.post__action-btn:hover { opacity: 1; text-decoration: underline; }

/* ---------- Profile page ---------- */
.profile-header {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-bottom: 28px;
}
.profile-header__avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.avatar-upload {
  font-size: 0.72rem;
  color: var(--emerald-800);
  cursor: pointer;
  text-decoration: underline;
}
.profile-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 20px;
  background: #fff;
}
.profile-card__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.profile-card h3 { font-size: 1.05rem; margin: 0 0 10px; }
.profile-card__head h3 { margin: 0; }

.detail-list { margin: 0; }
.detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
.detail-row:last-child { border-bottom: none; }
.detail-row dt { opacity: 0.6; }
.detail-row dd { margin: 0; font-weight: 500; }

.review-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
.review-row:last-child { border-bottom: none; }
.review-row__head { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
.review-row p { font-size: 0.88rem; opacity: 0.8; margin: 0; }

/* ---------- Orders ---------- */
.order-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  font-size: 0.92rem;
}
.order-row:last-child { border-bottom: none; }
.order-row__status {
  font-size: 0.78rem;
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--line);
  white-space: nowrap;
}
.order-row__status--available { color: #9a7a3f; border-color: #9a7a3f; }
.order-row__status--accepted { color: #0e352c; border-color: #0e352c; }
.order-row__status--pending { color: #9a7a3f; border-color: #9a7a3f; }
.order-row__status--declined { color: #a33; border-color: #a33; }

/* ---------- Shop ---------- */
.shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.cart-badge { font-size: 0.9rem; opacity: 0.8; }
.filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
.filter-btn {
  border: 1px solid var(--line);
  background: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  color: var(--ink);
}
.filter-btn.is-active { background: var(--emerald-900); color: var(--cream); border-color: var(--emerald-900); }

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
}
.product-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.product-card__thumb {
  height: 100px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--beige-200), var(--beige-400));
}
.product-card__category { font-size: 0.72rem; color: var(--emerald-700); opacity: 0.8; }
.product-card h3 { font-size: 0.95rem; margin: 0; }
.product-card__foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.product-card__foot .btn { padding: 8px 12px; font-size: 0.82rem; }

/* ---------- Chat / messages ---------- */
.app-shell--chat { grid-template-columns: 260px 1fr; }
.chat-shell {
  display: grid;
  grid-template-columns: 300px 1fr;
  min-height: 100vh;
}
.chat-contacts { border-right: 1px solid var(--line); overflow-y: auto; }
.chat-contacts__search { padding: 18px; border-bottom: 1px solid var(--line); }
.chat-contacts__search input {
  width: 100%;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  font-family: var(--font-sans);
}
.chat-contact {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border: none;
  background: none;
  cursor: pointer;
  text-align: left;
  border-bottom: 1px solid var(--line);
}
.chat-contact:hover, .chat-contact.is-active { background: var(--beige-200); }
.chat-contact__meta strong { display: block; font-size: 0.9rem; }
.chat-contact__meta span { font-size: 0.78rem; opacity: 0.6; display: block; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.chat-window { display: flex; flex-direction: column; height: 100vh; }
.chat-window__head { padding: 18px 24px; border-bottom: 1px solid var(--line); }
.chat-window__messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.chat-bubble { max-width: 60%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; }
.chat-bubble p { margin: 0; }
.chat-bubble span { font-size: 0.68rem; opacity: 0.6; display: block; margin-top: 4px; }
.chat-bubble--them { align-self: flex-start; background: var(--beige-200); border-bottom-left-radius: 2px; }
.chat-bubble--me { align-self: flex-end; background: var(--emerald-900); color: var(--cream); border-bottom-right-radius: 2px; }
.chat-window__input { display: flex; gap: 10px; padding: 18px 24px; border-top: 1px solid var(--line); }
.chat-window__input input { flex: 1; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--radius); font-family: var(--font-sans); }

/* ---------- Mobile bottom tab bar (только для внутренних страниц) ---------- */
.mobile-tabbar {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--emerald-900);
  border-top: 1px solid var(--line-on-dark);

/* =========================================================================
   ДАННЫЕ (слой localStorage) — было store.js, логика не менялась,

const DB_KEYS = {
  currentUserId: "aibolit_current_user_id",
  localAccounts: "aibolit_local_accounts",
  users: "aibolit_users",

};

const ROLE_LABELS = { VET: "Ветеринар", CLIENT: "Клиент", COURIER: "Курьер", SITTER: "Няня" };

function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
/** Пишет только в localStorage, без отправки в облако (используется при получении данных из Supabase). */
function writeJSONLocal(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
/** Обычная запись: сохраняет локально и, если ключ входит в список общих, отправляет в Supabase. */
function writeJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
  pushToCloud(key, value);
}
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 9); }

/* =========================================================================
   СИНХРОНИЗАЦИЯ С SUPABASE — делает сайт общим для всех посетителей.
   Общие данные (пользователи, посты, сообщения, заказы, товары) хранятся
   в таблице public.app_data (key text primary key, value jsonb) и лежат

const SUPABASE_URL = "https://poukroozsnvqowmqndun.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2jAwSHdDMuorJgyeDWBkhA_h33zqW-Q";
const SUPABASE_TABLE = "app_data";
const SYNCED_KEYS = [DB_KEYS.users, DB_KEYS.posts, DB_KEYS.messages, DB_KEYS.orders, DB_KEYS.products];

const sbClient = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
if (!sbClient) console.warn("Supabase SDK не загрузился — сайт работает только локально (offline-режим).");

async function pushToCloud(key, value) {
  if (!sbClient || !SYNCED_KEYS.includes(key)) return;
  try {
    const { error } = await sbClient.from(SUPABASE_TABLE).upsert({ key, value, updated_at: new Date().toISOString() });
    if (error) console.warn("Supabase upsert:", key, error.message);
  } catch (e) {
    console.warn("Supabase upsert failed:", key, e);
  }
}

/** Подгружает общие данные из Supabase поверх локального кэша. Возвращает true, если в облаке уже что-то было. */
async function pullFromCloud() {
  if (!sbClient) return false;
  try {
    const { data, error } = await sbClient.from(SUPABASE_TABLE).select("key, value").in("key", SYNCED_KEYS);
    if (error || !data) { console.warn("Supabase select:", error && error.message); return false; }
    data.forEach((row) => writeJSONLocal(row.key, row.value));
    return data.length > 0;
  } catch (e) {
    console.warn("Supabase pull failed:", e);
    return false;
  }
}

/** Слушает изменения от других посетителей в реальном времени и перерисовывает страницу. */
function subscribeCloud() {
  if (!sbClient) return;
  sbClient
    .channel("app_data_changes")
    .on("postgres_changes", { event: "*", schema: "public", table: SUPABASE_TABLE }, (payload) => {
      const row = payload.new;
      if (!row || !SYNCED_KEYS.includes(row.key)) return;
      writeJSONLocal(row.key, row.value);
      render();
    })
    .subscribe();
}

function acceptDelivery(orderId, etaMinutes) {
  const user = getCurrentUser();
  const orders = getOrders();
  const order = orders.deliveries.find((o) => o.id === orderId);
  if (!order || !user) return;
  order.status = "in_progress";
  order.courier = user.id;
  order.pickupEtaMinutes = etaMinutes;
  order.pickupDeadline = Date.now() + etaMinutes * 60000;
  order.dropoffEtaMinutes = null;
  order.dropoffDeadline = null;
  saveOrders(orders);
}
function startDropoffLeg(orderId, etaMinutes) {
  const orders = getOrders();
  const order = orders.deliveries.find((o) => o.id === orderId);
  if (!order) return;
  order.dropoffEtaMinutes = etaMinutes;
  order.dropoffDeadline = Date.now() + etaMinutes * 60000;
  saveOrders(orders);
}
function getDeliveryStage(order) {
  if (order.status !== "in_progress") {
    return { key: order.status, label: order.status === "delivered" ? "Доставлено" : "Ищет исполнителя" };
  }
  const now = Date.now();
  if (!order.dropoffDeadline) {
    if (now < order.pickupDeadline) return { key: "to_pickup", label: "Едет к точке А", remainingMs: order.pickupDeadline - now };
    return { key: "awaiting_dropoff_eta", label: "На месте А — ждёт время до точки B" };
  }
  if (now < order.dropoffDeadline) return { key: "to_dropoff", label: "Едет к точке B", remainingMs: order.dropoffDeadline - now };
  return { key: "delivered", label: "Доставлено" };
}
function deliveryProgressPct(order, stage) {
  if (stage.key === "to_pickup") {
    const total = order.pickupEtaMinutes * 60000;
    return Math.max(0, Math.min(100, ((total - stage.remainingMs) / total) * 100));
  }
  if (stage.key === "awaiting_dropoff_eta" || stage.key === "delivered") return 100;
  if (stage.key === "to_dropoff") {
    const total = order.dropoffEtaMinutes * 60000;
    return Math.max(0, Math.min(100, ((total - stage.remainingMs) / total) * 100));
  }
  return 0;
}
function formatCountdown(ms) {
  const total = Math.max(0, Math.round(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function fileToResizedDataUrl(file, maxSize = 800, quality = 0.85) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) { reject(new Error("Выберите файл-картинку")); return; }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Не удалось открыть картинку"));
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================================
   РОУТЕР — вместо отдельных .html-страниц теперь один файл.
   Внутренние переходы — через хэш вида "#/feed", "#/profile?id=...".
   Якоря на лендинге ("#roles", "#services") хэш-роутером не считаются
   переходами (нет ведущего слэша) — браузер сам скроллит к ним.
   ========================================================================= */

const APP_ROOT = () => document.getElementById("app");
let activeCleanup = null; // если у текущей страницы есть таймеры/карты — здесь лежит функция для их остановки

function navigate(path) {
  if (location.hash === "#" + path) { render(); return; }
  location.hash = path;
}

function getRoute() {
  let h = location.hash.slice(1);
  if (!h || !h.startsWith("/")) h = "/";
  const [path, query] = h.split("?");
  return { path: path || "/", params: new URLSearchParams(query || "") };
}

function render() {
  if (activeCleanup) { try { activeCleanup(); } catch (e) {} activeCleanup = null; }
  const { path, params } = getRoute();
  window.scrollTo(0, 0);
  document.body.className = "";

  switch (path) {
    case "/": renderHome(); break;
    case "/login": renderLogin(); break;
    case "/register": renderRegister(); break;
    case "/pending": renderPending(); break;
    case "/blocked": renderBlocked(); break;
    case "/admin": renderAdmin(); break;
    case "/feed": renderAppPage("feed", params); break;
    case "/messages": renderAppPage("messages", params); break;
    case "/orders": renderAppPage("orders", params); break;
    case "/shop": renderAppPage("shop", params); break;
    case "/profile": renderAppPage("profile", params); break;
    default: render404();
  }
}

/** Заполняет мини-карточку пользователя в сайдбаре и переключатель аккаунтов (было app-nav.js). */
function fillAppShellChrome(user) {
  const nameEl = document.querySelector("[data-user-name]");
  const roleEl = document.querySelector("[data-user-role]");
  const avatarEls = document.querySelectorAll("[data-user-avatar]");
  if (nameEl) nameEl.textContent = user.firstName + " " + user.lastName;
  if (roleEl) roleEl.textContent = roleLabel(user.role);
  avatarEls.forEach((el) => {
    if (user.avatar) { el.style.backgroundImage = `url(${user.avatar})`; el.textContent = ""; }
    else { el.textContent = avatarInitials(user); }
  });
  setupAccountSwitcher(user);
}

function setupAccountSwitcher(currentUser) {
  const toggle = document.getElementById("account-switcher-toggle");
  const panel = document.getElementById("account-switcher-panel");
  if (!toggle || !panel) return;
  const accounts = getLocalAccounts();

  panel.innerHTML = accounts
    .map((acc) => `<button type="button" class="account-switcher__item${acc.id === currentUser.id ? " is-active" : ""}" data-switch-to="${acc.id}">
        <span>${escapeHtml(acc.firstName)} ${escapeHtml(acc.lastName)}</span><small>${roleLabel(acc.role)}</small>
      </button>`)
    .join("") + `<a href="#/register" class="account-switcher__item account-switcher__item--add">+ Новый аккаунт</a>`;

  toggle.addEventListener("click", () => panel.classList.toggle("is-open"));
  panel.querySelectorAll("[data-switch-to]").forEach((btn) => {
    btn.addEventListener("click", () => { switchAccount(btn.dataset.switchTo); render(); });
  });
}

// Один постоянный обработчик на весь документ (а не по одному на каждый рендер
// страницы) — закрывает панель переключения аккаунта по клику вне неё.
document.addEventListener("click", (e) => {
  const panel = document.getElementById("account-switcher-panel");
  const toggle = document.getElementById("account-switcher-toggle");
  if (!panel || !panel.classList.contains("is-open")) return;
  if (!panel.contains(e.target) && e.target !== toggle) panel.classList.remove("is-open");
});

/** Общий вход для feed/messages/orders/shop/profile: проверка доступа + сборка каркаса + рендер контента. */
function renderAppPage(page, params) {
  const user = requireUser();
  if (!user) return;
  if (!enforceVerificationGate(user)) return;

  const builders = { feed: feedPage, messages: messagesPage, orders: ordersPage, shop: shopPage, profile: profilePage };
  builders[page](user, params);
  fillAppShellChrome(user);
}

  function goToStep(n) {
    steps.forEach((el) => el.classList.toggle("is-active", Number(el.dataset.step) === n));
    indicators.forEach((el) => {
      const i = Number(el.dataset.stepIndicator);
      el.classList.toggle("is-active", i === n);
      el.classList.toggle("is-done", i < n);

  }
  form.querySelectorAll("[data-next]").forEach((btn) => btn.addEventListener("click", () => { if (validateStep(currentStep)) goToStep(currentStep + 1); }));
  form.querySelectorAll("[data-back]").forEach((btn) => btn.addEventListener("click", () => goToStep(currentStep - 1)));

  function readFileAsDataUrl(inputEl) {
    return new Promise((resolve) => {
      const file = inputEl?.files?.[0];
      if (!file) return resolve(null);
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!validateStep(3)) return;
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Отправка документов...";

    const formData = new FormData(form);
    const payload = Object.fromEntries(formData.entries());
    const [idDocument, vetCertificate, driverLicense, carRegistration] = await Promise.all([
      readFileAsDataUrl(document.getElementById("doc-id")),
      readFileAsDataUrl(document.getElementById("vet-cert")),
      readFileAsDataUrl(document.getElementById("courier-license")),
      readFileAsDataUrl(document.getElementById("courier-tech")),
    ]);

    const needsReview = ROLES_REQUIRING_REVIEW.includes(payload.role);
    const user = {
      id: uid("user"), firstName: payload.firstName || "Пользователь", lastName: payload.lastName || "",
      role: payload.role, phone: payload.phone, email: payload.email, birthDate: payload.birthDate,
      avatar: null, bio: "", reviews: [],
      roleDetails: {
        vetEducation: payload.vetEducation || "", vetExperience: payload.vetExperience || "",
        carModel: payload.carModel || "", carNumber: payload.carNumber || "",
        sitterExperience: payload.sitterExperience || "", sitterAnimals: payload.sitterAnimals || "",
      },
      documents: { idDocument, vetCertificate, driverLicense, carRegistration },
      verificationStatus: needsReview ? "PENDING" : "APPROVED",
    };
    registerAccount(user);
    navigate(needsReview ? "/pending" : "/feed");
  });
}

function applicationCardTemplate(u) {
  const roleFieldsHtml = roleDetailsTemplate(u);

function roleDetailsTemplate(u) {
  const d = u.roleDetails || {};
  let rows = [];
  if (u.role === "VET") rows = [["Образование", d.vetEducation], ["Опыт", d.vetExperience ? d.vetExperience + " лет" : ""]];
  if (u.role === "COURIER") rows = [["Автомобиль", d.carModel], ["Гос. номер", d.carNumber]];
  if (u.role === "SITTER") rows = [["Опыт", d.sitterExperience ? d.sitterExperience + " лет" : ""], ["Животные", d.sitterAnimals]];
  rows = rows.filter(([, v]) => v);
  if (!rows.length) return "";
  return `<dl class="detail-list">${rows.map(([l, v]) => `<div class="detail-row"><dt>${l}</dt><dd>${escapeHtml(v)}</dd></div>`).join("")}</dl>`;
}

function documentsTemplate(docs) {
  const entries = [
    ["Документ, удостоверяющий личность", docs.idDocument],
    ["Сертификат ветеринара", docs.vetCertificate],
    ["Водительские права", docs.driverLicense],
    ["Техпаспорт автомобиля", docs.carRegistration],
  ].filter(([, value]) => value !== undefined);

  return entries.map(([label, value]) => {
    if (!value) return `<div class="doc-chip doc-chip--empty">${label}: файл не приложен</div>`;
    const isImage = typeof value === "string" && value.startsWith("data:image");
    return isImage
      ? `<a class="doc-thumb" href="${value}" target="_blank" rel="noopener"><img src="${value}" alt="${label}" /><span>${label}</span></a>`
      : `<a class="doc-chip" href="${value}" target="_blank" rel="noopener">${label}: открыть файл</a>`;
  }).join("");
}

function attachPostHandlers(list, currentUser) {
  list.querySelectorAll("[data-write-to]").forEach((btn) => btn.addEventListener("click", () => navigate("/messages?to=" + btn.dataset.writeTo)));
  list.querySelectorAll("[data-like]").forEach((btn) => btn.addEventListener("click", () => { toggleLike(btn.dataset.like); renderPosts(currentUser); }));

   СООБЩЕНИЯ (было messages.html + messages.js)
   ========================================================================= */
function messagesPage(me, params) {
  pageHead("Сообщения");
  const mainHtml = `
    <main class="chat-shell">
      <div class="chat-contacts">
        <div class="chat-contacts__search"><input type="search" id="contact-search" placeholder="Поиск по имени..." /></div>
        <div id="contacts-list"></div>
      </div>
      <div class="chat-window">
        <div class="chat-window__head" id="chat-head"><p style="opacity:0.6;">Выберите переписку слева</p></div>
        <div class="chat-window__messages" id="chat-messages"></div>
        <form class="chat-window__input" id="chat-form" style="display:none;">
          <label class="chat-attach">📎<input type="file" id="chat-image" accept="image/*" hidden /></label>
          <input type="text" id="chat-input" placeholder="Напишите сообщение..." autocomplete="off" />
          <button type="submit" class="btn btn--primary">Отправить</button>
        </form>
      </div>
    </main>`;

  APP_ROOT().innerHTML = appShellTemplate("messages", mainHtml, "", "app-shell--chat");

  let activeContactId = null;
  let pendingChatImage = null;

  function renderContacts(filter) {
    const list = document.getElementById("contacts-list");
    const contacts = getUsers().filter((u) => u.id !== me.id);
    const preview = getConversationsPreview(me.id);
    const filtered = filter ? contacts.filter((c) => (c.firstName + " " + c.lastName).toLowerCase().includes(filter)) : contacts;

    list.innerHTML = filtered.map((c) => {
      const last = preview[c.id] || null;
      const previewText = last ? (last.senderId === me.id ? "Вы: " : "") + last.text : "Нет сообщений — начните переписку";
      const activeClass = c.id === activeContactId ? " is-active" : "";
      return `
        <button type="button" class="chat-contact${activeClass}" data-contact="${c.id}">
          <div class="avatar avatar--sm"${c.avatar ? ` style="background-image:url(${c.avatar})"` : ""}>${c.avatar ? "" : avatarInitials(c)}</div>
          <div class="chat-contact__meta"><strong>${escapeHtml(c.firstName)} ${escapeHtml(c.lastName)}</strong><span>${escapeHtml(previewText)}</span></div>
        </button>`;
    }).join("");

    list.querySelectorAll("[data-contact]").forEach((btn) => btn.addEventListener("click", () => openConversation(btn.dataset.contact)));
  }

  function openConversation(contactId) {
    const contact = getUserById(contactId);
    if (!contact) return;
    activeContactId = contactId;
    renderContacts(document.getElementById("contact-search").value.trim().toLowerCase());

    document.getElementById("chat-head").innerHTML = `
      <a href="#/profile?id=${contact.id}" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;">
        <div class="avatar avatar--sm"${contact.avatar ? ` style="background-image:url(${contact.avatar})"` : ""}>${contact.avatar ? "" : avatarInitials(contact)}</div>
        <div><strong>${escapeHtml(contact.firstName)} ${escapeHtml(contact.lastName)}</strong><br><span style="font-size:0.8rem;opacity:0.6;">${roleLabel(contact.role)}</span></div>
      </a>`;
    document.getElementById("chat-form").style.display = "flex";
    renderMessages(contactId);
  }

  function renderMessages(contactId) {
    const box = document.getElementById("chat-messages");
    const conv = getConversation(me.id, contactId);
    if (!conv.messages.length) {
      box.innerHTML = `<p style="opacity:0.5;text-align:center;margin-top:40px;">Сообщений пока нет — напишите первым.</p>`;
    } else {
      box.innerHTML = conv.messages.map((m) => `
        <div class="chat-bubble chat-bubble--${m.senderId === me.id ? "me" : "them"}">
          <p>${escapeHtml(m.text)}</p>
          <span>${new Date(m.time).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })}</span>
        </div>`).join("");
    }
    box.scrollTop = box.scrollHeight;
  }

  document.getElementById("contact-search").addEventListener("input", (e) => renderContacts(e.target.value.trim().toLowerCase()));
  document.getElementById("chat-image").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingChatImage = reader.result;
      document.getElementById("chat-input").placeholder = "Фото прикреплено — добавьте подпись (необязательно)";
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("chat-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if ((!text && !pendingChatImage) || !activeContactId) return;
    sendMessage(me.id, activeContactId, text, pendingChatImage);
    input.value = "";
    input.placeholder = "Напишите сообщение...";
    pendingChatImage = null;
    document.getElementById("chat-image").value = "";
    renderMessages(activeContactId);
    renderContacts();
  });

  renderContacts();
  const preselect = params.get("to");
  if (preselect) openConversation(preselect);
}

  const products = getProducts().filter((p) => category === "all" || p.category === category);
  grid.innerHTML = products.map((p) => `

  });

function renderCart() {
  const rows = getCartDetailed();
  document.getElementById("cart-count").textContent = getCart().length;
  document.getElementById("cart-total").textContent = getCartTotal().toLocaleString("ru-RU") + " ₸";

        <div class="cart-line__qty">
          <button type="button" data-cart-minus="${row.product.id}">−</button>
          <span>${row.qty}</span>
          <button type="button" data-cart-plus="${row.product.id}">+</button>

      </div>`).join("") : `<p style="opacity:0.6;font-size:0.9rem;">Корзина пуста — добавьте что-нибудь слева.</p>`;

  box.querySelectorAll("[data-cart-plus]").forEach((b) => b.addEventListener("click", () => { addToCart(b.dataset.cartPlus); renderCart(); }));
  box.querySelectorAll("[data-cart-minus]").forEach((b) => b.addEventListener("click", () => { removeOneFromCart(b.dataset.cartMinus); renderCart(); }));
  box.querySelectorAll("[data-cart-remove]").forEach((b) => b.addEventListener("click", () => { removeAllFromCart(b.dataset.cartRemove); renderCart(); }));
}

/* ---------- Мои питомцы ---------- */
function renderPets(person, isOwn) {
  const card = document.getElementById("pets-card");
  const grid = document.getElementById("pets-grid");
  const empty = document.getElementById("pets-empty");
  const pets = person.pets || [];

  if (!pets.length && !isOwn) { card.style.display = "none"; return; }
  card.style.display = "block";
  empty.style.display = pets.length ? "none" : "block";
  grid.innerHTML = pets.map((p) => petCardTemplate(p, isOwn)).join("");

  if (isOwn) { attachPetHandlers(grid); setupPetAdding(); }
}

function patchPet(petId, patch) {
  const current = getCurrentUser();
  const pets = (current.pets || []).map((p) => (p.id === petId ? Object.assign({}, p, patch) : p));
  return updateCurrentUser({ pets });
}

function attachPetHandlers(grid) {
  grid.querySelectorAll("[data-remove-pet]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const current = getCurrentUser();
      const updated = updateCurrentUser({ pets: (current.pets || []).filter((p) => p.id !== btn.dataset.removePet) });
      renderPets(updated, true);
    });
  });
  grid.querySelectorAll("[data-edit-pet]").forEach((btn) => {
    btn.addEventListener("click", () => {
      editingPetId = btn.dataset.editPet;
      renderPets(getCurrentUser(), true);
      const input = grid.querySelector(`[data-pet-name-input="${editingPetId}"]`);
      if (input) { input.focus(); input.select(); }
    });
  });
  grid.querySelectorAll("[data-pet-cancel]").forEach((btn) => btn.addEventListener("click", () => { editingPetId = null; renderPets(getCurrentUser(), true); }));
  grid.querySelectorAll("[data-pet-form]").forEach((form) => {
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = form.dataset.petForm;
      const name = form.querySelector("[data-pet-name-input]").value.trim();
      const species = form.querySelector("[data-pet-species-input]").value.trim();
      if (!name) { form.querySelector("[data-pet-name-input]").focus(); return; }
      editingPetId = null;
      renderPets(patchPet(id, { name, species }), true);
    });
  });
  grid.querySelectorAll("[data-pet-photo]").forEach((input) => {
    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;
      const id = input.dataset.petPhoto;
      try {
        const photo = await fileToResizedDataUrl(file, 400);
        petError = { id: null, text: "" };
        renderPets(patchPet(id, { photo }), true);
      } catch (err) {
        petError = { id, text: err && err.name === "QuotaExceededError" ? "Не хватает места в браузере" : (err.message || "Не удалось сохранить фото") };
        renderPets(getCurrentUser(), true);
      }
    });
  });
}

function petCardTemplate(pet, isOwn) {
  const photoStyle = pet.photo ? ` style="background-image:url('${pet.photo}')"` : "";
  const photoEl = `<div class="pet-card__photo"${photoStyle}>${pet.photo ? "" : "🐾"}</div>`;
  const editing = isOwn && editingPetId === pet.id;

  const photoBlock = isOwn
    ? `<label class="pet-card__photo-wrap" title="${pet.photo ? "Изменить фото" : "Добавить фото"}">${photoEl}<span class="pet-card__photo-badge">📷</span><input type="file" accept="image/*" hidden data-pet-photo="${pet.id}" /></label>`
    : photoEl;

  const infoBlock = editing
    ? `<form class="pet-card__form" data-pet-form="${pet.id}">
         <input data-pet-name-input="${pet.id}" value="${escapeAttr(pet.name)}" placeholder="Кличка" maxlength="40" required />
         <input data-pet-species-input="${pet.id}" value="${escapeAttr(pet.species)}" placeholder="Вид / порода" maxlength="40" />
         <div class="pet-card__form-actions">
           <button type="submit" class="btn btn--primary">Ок</button>
           <button type="button" class="btn btn--ghost" data-pet-cancel="${pet.id}">Отмена</button>
         </div>
       </form>`
    : `<div class="pet-card__name">${escapeHtml(pet.name)}</div>${pet.species ? `<div class="pet-card__species">${escapeHtml(pet.species)}</div>` : ""}`;

  return `
    <div class="pet-card">
      ${isOwn ? `<button type="button" class="pet-card__edit" data-edit-pet="${pet.id}" title="Изменить имя">✎</button>` : ""}
      ${isOwn ? `<button type="button" class="pet-card__remove" data-remove-pet="${pet.id}" title="Удалить">✕</button>` : ""}
      ${photoBlock}
      ${infoBlock}
      ${petError.id === pet.id ? `<div class="pet-card__error">${escapeHtml(petError.text)}</div>` : ""}
    </div>`;
}

function setupPetAdding() {
  const toggle = document.getElementById("pet-add-toggle");
  const form = document.getElementById("pet-add-form");
  toggle.style.display = "inline-flex";

  const nameInput = document.getElementById("pet-name");
  const speciesInput = document.getElementById("pet-species");
  const photoInput = document.getElementById("pet-photo-input");
  const filenameEl = document.getElementById("pet-photo-filename");
  let pendingPhoto = null;

  const resetForm = () => { form.reset(); form.style.display = "none"; pendingPhoto = null; filenameEl.textContent = ""; };

  toggle.addEventListener("click", () => { form.style.display = form.style.display === "none" ? "block" : "none"; });
  document.getElementById("pet-cancel-btn").addEventListener("click", resetForm);

  photoInput.addEventListener("change", async () => {
    const file = photoInput.files[0];
    if (!file) return;
    filenameEl.textContent = "Обрабатываю…";
    try { pendingPhoto = await fileToResizedDataUrl(file, 400); filenameEl.textContent = file.name; }
    catch (err) { pendingPhoto = null; filenameEl.textContent = err.message; }
  });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = nameInput.value.trim();
    if (!name) return;
    const pet = { id: uid("pet"), name, species: speciesInput.value.trim(), photo: pendingPhoto };
    const current = getCurrentUser();
    try {
      const updated = updateCurrentUser({ pets: (current.pets || []).concat(pet) });
      resetForm();
      renderPets(updated, true);
    } catch (err) { filenameEl.textContent = "Не хватает места в браузере — попробуйте фото поменьше"; }
  });
}

function setupBioEditing(person) {
  const editBtn = document.getElementById("bio-edit-btn");
  const viewEl = document.getElementById("bio-view");
  const editBox = document.getElementById("bio-edit");
  const input = document.getElementById("bio-input");

  editBtn.style.display = "inline-flex";
  editBtn.addEventListener("click", () => { input.value = person.bio || ""; viewEl.style.display = "none"; editBox.style.display = "block"; });
  document.getElementById("bio-cancel-btn").addEventListener("click", () => { editBox.style.display = "none"; viewEl.style.display = "block"; });
  document.getElementById("bio-save-btn").addEventListener("click", () => {
    const updated = updateCurrentUser({ bio: input.value.trim() });
    viewEl.textContent = updated.bio || "Пользователь пока не заполнил описание.";
    editBox.style.display = "none";
    viewEl.style.display = "block";
  });
}

function setupAvatarUpload() {
  const label = document.getElementById("avatar-upload-label");
  label.style.display = "inline-block";
  const input = document.getElementById("avatar-input");
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const updated = updateCurrentUser({ avatar: reader.result });
      document.getElementById("profile-avatar").style.backgroundImage = `url(${updated.avatar})`;
      document.getElementById("profile-avatar").textContent = "";
      document.querySelectorAll("[data-user-avatar]").forEach((el) => { el.style.backgroundImage = `url(${updated.avatar})`; el.textContent = ""; });
    };
    reader.readAsDataURL(file);
  });
}

function renderRoleDetails(person) {
  const card = document.getElementById("role-details-card");
  const list = document.getElementById("role-details-list");
  const d = person.roleDetails || {};
  let rows = [];
  if (person.role === "VET") rows = [["Образование", d.vetEducation], ["Опыт работы", d.vetExperience ? d.vetExperience + " лет" : ""]];
  else if (person.role === "COURIER") rows = [["Автомобиль", d.carModel], ["Гос. номер", d.carNumber]];
  else if (person.role === "SITTER") rows = [["Опыт", d.sitterExperience ? d.sitterExperience + " лет" : ""], ["Животные", d.sitterAnimals]];
  rows = rows.filter(([, v]) => v);
  if (!rows.length) return;
  card.style.display = "block";
  list.innerHTML = rows.map(([label, value]) => `<div class="detail-row"><dt>${label}</dt><dd>${escapeHtml(value)}</dd></div>`).join("");
}

function renderReviews(person) {
  const box = document.getElementById("reviews-list");
  const reviews = person.reviews || [];
  if (!reviews.length) { box.innerHTML = `<p style="opacity:0.6;">Пока нет отзывов.</p>`; return; }
  box.innerHTML = reviews.map((r) => `
      <div class="review-row">
        <div class="review-row__head"><strong>${escapeHtml(r.author)}</strong><span>${"★".repeat(r.rating)}${"☆".repeat(5 - r.rating)}</span></div>
        <p>${escapeHtml(r.text)}</p>
      </div>`).join("");
}

function renderAppeals(person, isOwn) {
  if (!isOwn || person.role !== "VET") return;
  const orders = getOrders();
  const appeals = orders.appointments.filter((a) => a.vet === person.id);
  if (!appeals.length) return;
  document.getElementById("appeals-card").style.display = "block";
  document.getElementById("appeals-list").innerHTML = appeals.map((a) => `
      <div class="review-row">
        <div class="review-row__head"><strong>${escapeHtml(a.client)}</strong><span>${a.status === "pending" ? "Ожидает ответа" : "Принято"}</span></div>
        <p>Питомец: ${escapeHtml(a.pet)}. Причина: ${escapeHtml(a.reason)}</p>
      </div>`).join("");
}

  VET: "Подтверждайте заявки на приём и следите за доставками питомцев в клинику.",
};
const STATUS_LABEL = { available: "Ищет исполнителя", accepted: "В работе", pending: "Ожидает", declined: "Отклонено" };

let orderUser = null;
let tickTimer = null;
let ordersStorageListener = null;

function ordersPage(user) {
  pageHead("Заказы");
  orderUser = user;

  const mainHtml = `
    <main class="app-main" style="max-width:760px;">
      <h2 style="margin-bottom:8px;">Заказы</h2>
      <p id="orders-subtitle" style="opacity:0.65;margin-bottom:28px;"></p>

      <section class="profile-card" data-role-section="CLIENT">
        <h3>Новая заявка</h3>
        <div class="field-row">
          <div class="field"><label for="order-type">Тип заявки</label>
            <select id="order-type">
              <option value="delivery">Доставка питомца</option>
              <option value="sitter">Присмотр (няня)</option>
              <option value="appointment">Запись к ветеринару</option>
            </select>
          </div>
          <div class="field"><label for="order-pet">Питомец</label><input id="order-pet" type="text" placeholder="Например: кот Барсик" /></div>

      </section>

      <section class="profile-card" data-role-section="CLIENT"><h3>Мои заявки</h3><div id="client-orders-list"></div></section>

      <section class="profile-card" data-role-section="COURIER"><h3>Доступные доставки</h3><div id="courier-available-list"></div></section>
      <section class="profile-card" data-role-section="COURIER"><h3>Мои поездки</h3><div id="courier-mine-list"></div></section>

      <section class="profile-card" data-role-section="SITTER"><h3>Доступные заявки на присмотр</h3><div id="sitter-available-list"></div></section>
      <section class="profile-card" data-role-section="SITTER"><h3>Мои заявки</h3><div id="sitter-mine-list"></div></section>

      <section class="profile-card" data-role-section="VET"><h3>Заявки на приём</h3><div id="vet-appointments-list"></div></section>
      <section class="profile-card" data-role-section="VET"><h3>Доставки в клинику</h3><div id="vet-deliveries-list"></div></section>
    </main>`;
  const asideHtml = `
    <aside class="app-aside">
      <h4>Как это работает</h4>
      <p style="font-size:0.88rem;opacity:0.75;">Клиент создаёт заявку → курьер или няня берут её в работу → ветеринар подтверждает приём. Статус виден на каждой карточке.</p>
    </aside>`;

  APP_ROOT().innerHTML = appShellTemplate("orders", mainHtml, asideHtml);

  document.getElementById("orders-subtitle").textContent = ORDERS_SUBTITLES[orderUser.role] || "";
  document.querySelectorAll("[data-role-section]").forEach((section) => {
    section.style.display = section.dataset.roleSection === orderUser.role ? "block" : "none";
  });

  if (orderUser.role === "CLIENT") { document.getElementById("order-submit").addEventListener("click", createOrder); renderClientOrders(); }
  if (orderUser.role === "COURIER") renderCourierOrders();
  if (orderUser.role === "SITTER") renderSitterOrders();
  if (orderUser.role === "VET") { renderVetAppointments(); renderVetDeliveries(); }

  tickTimer = setInterval(tickDeliveryCards, 1000);
  ordersStorageListener = (e) => {
    if (e.key === "aibolit_orders") {
      if (orderUser.role === "CLIENT") renderClientOrders();
      if (orderUser.role === "COURIER") renderCourierOrders();
      if (orderUser.role === "SITTER") renderSitterOrders();
      if (orderUser.role === "VET") { renderVetAppointments(); renderVetDeliveries(); }
    }

  window.addEventListener("storage", ordersStorageListener);

  activeCleanup = () => {

function fullName(user) { return `${user.firstName} ${user.lastName}`; }

function visibleDeliveries() {
  if (!orderUser) return [];
  const orders = getOrders();
  if (orderUser.role === "CLIENT") { const client = fullName(orderUser); return orders.deliveries.filter((o) => o.client === client); }
  if (orderUser.role === "COURIER") return orders.deliveries.filter((o) => o.status === "in_progress" && o.courier === orderUser.id);
  if (orderUser.role === "VET") return orders.deliveries.filter((o) => o.status === "in_progress" || o.status === "delivered");
  return [];
}

function tickDeliveryCards() {
  if (!orderUser) return;
  let needsFullRerender = false;
  visibleDeliveries().forEach((order) => {
    const stage = getDeliveryStage(order);
    const card = document.querySelector(`[data-order-id="${order.id}"]`);
    if (!card) return;
    if (card.dataset.stageKey !== stage.key) { needsFullRerender = true; return; }
    const statusEl = document.getElementById("status-" + order.id);
    if (statusEl) statusEl.textContent = stage.label;
    const etaEl = document.getElementById("eta-" + order.id);
    if (etaEl) {
      if (stage.key === "to_pickup") etaEl.textContent = `Прибудет к точке А через ${formatCountdown(stage.remainingMs)}`;
      else if (stage.key === "to_dropoff") etaEl.textContent = `Прибудет к точке B через ${formatCountdown(stage.remainingMs)}`;
    }
    updateDeliveryMarker(order, stage);
  });
  if (needsFullRerender) {
    if (orderUser.role === "CLIENT") renderClientOrders();
    if (orderUser.role === "COURIER") renderCourierOrders();
    if (orderUser.role === "VET") renderVetDeliveries();
  }
}

function mountVisibleDeliveryMaps(list) {
  cleanupDeliveryMaps(list.map((o) => o.id));
  list.forEach((order) => mountDeliveryMap(order, getDeliveryStage(order), "map-" + order.id));
}

function createOrder() {
  const type = document.getElementById("order-type").value;
  const pet = document.getElementById("order-pet").value.trim();
  const details = document.getElementById("order-details").value.trim();
  if (!pet) { alert("Укажите питомца."); return; }

  const orders = getOrders();
  const client = fullName(orderUser);
  if (type === "delivery") {
    orders.deliveries.unshift({ id: "ord_" + Date.now(), client, pet, from: details || "адрес клиента", to: "Клиника Айболит",
      status: "available", courier: null, pickupEtaMinutes: null, pickupDeadline: null, dropoffEtaMinutes: null, dropoffDeadline: null });
  } else if (type === "sitter") {
    orders.sitterRequests.unshift({ id: "ord_" + Date.now(), client, pet, dates: details || "не указано", status: "available", sitter: null });
  } else {
    orders.appointments.unshift({ id: "ord_" + Date.now(), client, pet, reason: details || "не указано", status: "pending", vet: null });
  }
  saveOrders(orders);
  document.getElementById("order-pet").value = "";
  document.getElementById("order-details").value = "";
  renderClientOrders();
}

/* ---------------- CLIENT ---------------- */
function renderClientOrders() {
  const client = fullName(orderUser);
  const orders = getOrders();
  const deliveries = orders.deliveries.filter((o) => o.client === client);
  const sitterRows = orders.sitterRequests.filter((o) => o.client === client).map((o) => ({ label: `Присмотр: ${o.pet}`, status: o.status }));
  const apptRows = orders.appointments.filter((o) => o.client === client).map((o) => ({ label: `Приём: ${o.pet}`, status: o.status }));

  const deliveryHtml = deliveries.map((o) => deliveryTrackingCard(o, false)).join("");
  const simpleHtml = [...sitterRows, ...apptRows].map(orderRowTemplate).join("");
  const html = deliveryHtml + simpleHtml;

  document.getElementById("client-orders-list").innerHTML = html || `<p style="opacity:0.6;">Заявок пока нет — создайте первую выше.</p>`;
  mountVisibleDeliveryMaps(deliveries);
}

/* ---------------- COURIER ---------------- */
function renderCourierOrders() {
  const orders = getOrders();
  const available = orders.deliveries.filter((o) => o.status === "available");
  const mine = orders.deliveries.filter((o) => o.status === "in_progress" || (o.status === "delivered" && o.courier === orderUser.id));
  const mineActive = mine.filter((o) => o.courier === orderUser.id);

  document.getElementById("courier-available-list").innerHTML = available.length ? available.map(availableDeliveryTemplate).join("") : `<p style="opacity:0.6;">Пока нет доступных заказов.</p>`;
  document.getElementById("courier-mine-list").innerHTML = mineActive.length ? mineActive.map((o) => deliveryTrackingCard(o, true)).join("") : `<p style="opacity:0.6;">Вы ещё не взяли ни одного заказа.</p>`;
  mountVisibleDeliveryMaps(mineActive);

  document.querySelectorAll("[data-accept-form]").forEach((form) => form.addEventListener("submit", (e) => {
    e.preventDefault();
    const minutes = Number(form.querySelector("input").value);
    if (!minutes || minutes <= 0) return;
    acceptDelivery(form.dataset.acceptForm, minutes);
    renderCourierOrders();
  }));
  document.querySelectorAll("[data-dropoff-form]").forEach((form) => form.addEventListener("submit", (e) => {
    e.preventDefault();
    const minutes = Number(form.querySelector("input").value);
    if (!minutes || minutes <= 0) return;
    startDropoffLeg(form.dataset.dropoffForm, minutes);
    renderCourierOrders();
  }));
}

/* ---------------- SITTER ---------------- */
function renderSitterOrders() {
  const orders = getOrders();
  const available = orders.sitterRequests.filter((o) => o.status === "available");
  const mine = orders.sitterRequests.filter((o) => o.status === "accepted" && o.sitter === orderUser.id);

  document.getElementById("sitter-available-list").innerHTML = available.length ? available.map((o) => sitterRowTemplate(o, true)).join("") : `<p style="opacity:0.6;">Пока нет доступных заявок.</p>`;
  document.getElementById("sitter-mine-list").innerHTML = mine.length ? mine.map((o) => sitterRowTemplate(o, false)).join("") : `<p style="opacity:0.6;">Вы ещё не взяли ни одной заявки.</p>`;

  document.querySelectorAll("[data-accept-sitter]").forEach((btn) => btn.addEventListener("click", () => {
    const orders2 = getOrders();
    const order = orders2.sitterRequests.find((o) => o.id === btn.dataset.acceptSitter);
    order.status = "accepted"; order.sitter = orderUser.id;
    saveOrders(orders2);
    renderSitterOrders();
  }));
}

/* ---------------- VET ---------------- */
function renderVetAppointments() {
  const orders = getOrders();
  const list = orders.appointments.filter((o) => o.vet === orderUser.id || o.status === "pending");
  document.getElementById("vet-appointments-list").innerHTML = list.length ? list.map(appointmentRowTemplate).join("") : `<p style="opacity:0.6;">Заявок на приём пока нет.</p>`;

  document.querySelectorAll("[data-appt-action]").forEach((btn) => btn.addEventListener("click", () => {
    const orders2 = getOrders();
    const order = orders2.appointments.find((o) => o.id === btn.dataset.apptId);
    order.status = btn.dataset.apptAction === "accept" ? "accepted" : "declined";
    order.vet = orderUser.id;
    saveOrders(orders2);
    renderVetAppointments();
  }));
}
function renderVetDeliveries() {
  const orders = getOrders();
  const active = orders.deliveries.filter((o) => o.status === "in_progress" || o.status === "delivered");
  const box = document.getElementById("vet-deliveries-list");
  if (!box) return;
  box.innerHTML = active.length ? active.map((o) => deliveryTrackingCard(o, false)).join("") : `<p style="opacity:0.6;">Сейчас в пути нет ни одной доставки.</p>`;
  mountVisibleDeliveryMaps(active);

  let pointA = order.from, pointB = order.to, etaText = "";

  else if (stage.key === "awaiting_dropoff_eta") { pointA = "Курьер"; pointB = order.from; etaText = "На месте А"; }

  return `

}

/* =========================================================================
   ГЕО / КАРТА (было geo.js) — Nominatim для геокодирования, OSRM для маршрута.
   ========================================================================= */
const GEO_CACHE_KEY = "aibolit_geocode_cache";
const CITY_HINT = "Алматы, Казахстан";
const CLINIC_COORDS = { lat: 43.238293, lon: 76.889709 };

function readGeoCache() { try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY)) || {}; } catch (e) { return {}; } }
function writeGeoCache(cache) { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); }

async function geocodeAddress(rawAddress) {
  const address = (rawAddress || "").trim();
  if (!address) return null;
  if (/айболит/i.test(address)) return CLINIC_COORDS;
  const cache = readGeoCache();
  if (cache[address]) return cache[address];
  const query = /алматы/i.test(address) ? address : `${address}, ${CITY_HINT}`;
  try {
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (!data || !data[0]) return null;
    const coords = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
    cache[address] = coords; writeGeoCache(cache);
    return coords;
  } catch (e) { console.warn("Геокодирование не удалось:", address, e); return null; }
}

const routeCache = {};
async function fetchRoute(from, to) {
  const key = `${from.lat.toFixed(5)},${from.lon.toFixed(5)}-${to.lat.toFixed(5)},${to.lon.toFixed(5)}`;
  if (routeCache[key]) return routeCache[key];
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    const data = await res.json();
    const coords = data && data.routes && data.routes[0] && data.routes[0].geometry.coordinates;
    const latlngs = coords ? coords.map(([lon, lat]) => [lat, lon]) : [[from.lat, from.lon], [to.lat, to.lon]];
    routeCache[key] = latlngs;
    return latlngs;
  } catch (e) {
    const fallback = [[from.lat, from.lon], [to.lat, to.lon]];
    routeCache[key] = fallback;
    return fallback;
  }
}

function syntheticCourierStart(point) {
  const distanceKm = 1.5 + Math.random() * 1.5;
  const bearing = Math.random() * Math.PI * 2;
  const dLat = (distanceKm / 111) * Math.cos(bearing);
  const dLon = (distanceKm / (111 * Math.cos((point.lat * Math.PI) / 180))) * Math.sin(bearing);
  return { lat: point.lat + dLat, lon: point.lon + dLon };
}

function pointAlongRoute(latlngs, pct) {
  if (!latlngs || latlngs.length === 0) return null;
  if (latlngs.length === 1) return latlngs[0];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  let total = 0;
  const segLens = [];
  for (let i = 0; i < latlngs.length - 1; i++) { const d = dist(latlngs[i], latlngs[i + 1]); segLens.push(d); total += d; }
  const target = (Math.max(0, Math.min(100, pct)) / 100) * total;
  let covered = 0;
  for (let i = 0; i < segLens.length; i++) {
    if (covered + segLens[i] >= target || i === segLens.length - 1) {
      const remain = segLens[i] === 0 ? 0 : (target - covered) / segLens[i];
      const [lat1, lon1] = latlngs[i];
      const [lat2, lon2] = latlngs[i + 1];
      return [lat1 + (lat2 - lat1) * remain, lon1 + (lon2 - lon1) * remain];
    }
    covered += segLens[i];
  }
  return latlngs[latlngs.length - 1];
}

const deliveryMaps = {};
let COURIER_ICON, POINT_ICON_A, POINT_ICON_B;
function ensureLeafletIcons() {
  if (typeof L === "undefined") return false;
  if (!COURIER_ICON) {
    COURIER_ICON = L.divIcon({ html: "🚚", className: "courier-marker", iconSize: [28, 28], iconAnchor: [14, 14] });
    POINT_ICON_A = L.divIcon({ html: "📍", className: "courier-marker", iconSize: [22, 22], iconAnchor: [11, 22] });
    POINT_ICON_B = L.divIcon({ html: "🏁", className: "courier-marker", iconSize: [22, 22], iconAnchor: [11, 22] });
  }
  return true;
}

async function mountDeliveryMap(order, stage, containerId) {
  if (!["to_pickup", "awaiting_dropoff_eta", "to_dropoff", "delivered"].includes(stage.key)) return;
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!ensureLeafletIcons()) { el.innerHTML = `<div class="route-map-real__loading">Карта недоступна офлайн.</div>`; return; }

  const existing = deliveryMaps[order.id];
  if (existing && existing.stageKey === stage.key && existing.map.getContainer() === el) { updateDeliveryMarker(order, stage); return; }
  if (existing) { existing.map.remove(); delete deliveryMaps[order.id]; }

  el.innerHTML = `<div class="route-map-real__loading">Определяем адрес на карте…</div>`;
  const pickupLeg = stage.key === "to_pickup" || stage.key === "awaiting_dropoff_eta";
  const toCoord = await geocodeAddress(pickupLeg ? order.from : order.to);
  if (!document.getElementById(containerId)) return;
  if (!toCoord) { el.innerHTML = `<div class="route-map-real__loading">Не получилось найти этот адрес на карте.<br>Попробуйте указать адрес точнее (улица, дом).</div>`; return; }

  let fromCoord;
  if (!pickupLeg) {
    fromCoord = await geocodeAddress(order.from);
    if (!fromCoord) fromCoord = syntheticCourierStart(toCoord);
  } else {
    const cache = readGeoCache();
    const cacheKey = "start_" + order.id;
    fromCoord = cache[cacheKey] || syntheticCourierStart(toCoord);
    if (!cache[cacheKey]) { cache[cacheKey] = fromCoord; writeGeoCache(cache); }
  }

  const routeLatLngs = await fetchRoute(fromCoord, toCoord);
  if (!document.getElementById(containerId)) return;

  el.innerHTML = "";
  const map = L.map(containerId, { zoomControl: false, attributionControl: false, scrollWheelZoom: false });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
  L.control.attribution({ prefix: false }).addAttribution("© OpenStreetMap").addTo(map);

  const line = L.polyline(routeLatLngs, { color: "#0e352c", weight: 4, opacity: 0.85 }).addTo(map);
  L.marker(routeLatLngs[0], { icon: POINT_ICON_A }).addTo(map);
  L.marker(routeLatLngs[routeLatLngs.length - 1], { icon: POINT_ICON_B }).addTo(map);
  const marker = L.marker(routeLatLngs[0], { icon: COURIER_ICON }).addTo(map);
  map.fitBounds(line.getBounds(), { padding: [24, 24] });

  deliveryMaps[order.id] = { map, marker, routeLatLngs, stageKey: stage.key };
  updateDeliveryMarker(order, stage);
}

function updateDeliveryMarker(order, stage) {
  const entry = deliveryMaps[order.id];
  if (!entry || entry.stageKey !== stage.key) return;
  const pct = deliveryProgressPct(order, stage);
  const point = pointAlongRoute(entry.routeLatLngs, pct);
  if (point) entry.marker.setLatLng(point);
}

function removeDeliveryMap(orderId) {
  const entry = deliveryMaps[orderId];
  if (entry) { entry.map.remove(); delete deliveryMaps[orderId]; }
}
function cleanupDeliveryMaps(currentIds) {
  Object.keys(deliveryMaps).forEach((id) => { if (!currentIds.includes(id)) removeDeliveryMap(id); });
}
  </script>
